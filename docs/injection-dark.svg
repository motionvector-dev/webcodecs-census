<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img"
     aria-label="Two-phase injection: at the auto-attach pause a worker has frame types but no codecs or timers; at the beforeScriptExecution pause it has everything, still before the worker's own code runs.">
  <rect width="900" height="430" fill="none"/>

  <text x="0" y="18" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#f0f6fc">
    Getting instrumentation into a worker before its first line
  </text>
  <text x="0" y="38" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#9198a1">
    A dedicated worker's global is only half built when Chrome first pauses it.
  </text>

  <!-- timeline -->
  <line x1="30" y1="72" x2="870" y2="72" stroke="#3d444d" stroke-width="2"/>
  
  <circle cx="30" cy="72" r="5"
          fill="#9198a1"/>
  <text x="30" y="56" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12"
        font-weight="400"
        fill="#9198a1"
        text-anchor="start">new Worker()</text>
  <circle cx="300" cy="72" r="7"
          fill="#4493f8"/>
  <text x="300" y="56" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12"
        font-weight="600"
        fill="#4493f8"
        text-anchor="middle">auto-attach pause</text>
  <circle cx="600" cy="72" r="7"
          fill="#4493f8"/>
  <text x="600" y="56" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12"
        font-weight="600"
        fill="#4493f8"
        text-anchor="middle">beforeScriptExecution</text>
  <circle cx="870" cy="72" r="5"
          fill="#9198a1"/>
  <text x="870" y="60" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12"
        font-weight="400"
        fill="#9198a1"
        text-anchor="end">worker code runs</text>

  
  <rect x="170" y="100" width="260" height="290" rx="8"
        fill="#151b23" stroke="#f85149" stroke-width="1.5"/>
  <text x="186" y="126" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14"
        font-weight="600" fill="#f0f6fc">Phase 1 — too early</text>
  <text x="186" y="146" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12"
        fill="#9198a1">Target.setAutoAttach, waitForDebuggerOnStart</text>
  <path d="M190 161 l4 4 l7 -8" fill="none" stroke="#3fb950" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
    <text x="210" y="169" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12.5"
          fill="#f0f6fc">VideoFrame</text><path d="M190 182 l4 4 l7 -8" fill="none" stroke="#3fb950" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
    <text x="210" y="190" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12.5"
          fill="#f0f6fc">AudioData</text><path d="M190 203 l4 4 l7 -8" fill="none" stroke="#3fb950" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
    <text x="210" y="211" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12.5"
          fill="#f0f6fc">EncodedVideoChunk</text><path d="M190 221 l10 10 M200 221 l-10 10" fill="none"
              stroke="#f85149" stroke-width="2" stroke-linecap="round"/>
    <text x="210" y="232" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12.5"
          fill="#9198a1">VideoDecoder</text><path d="M190 242 l10 10 M200 242 l-10 10" fill="none"
              stroke="#f85149" stroke-width="2" stroke-linecap="round"/>
    <text x="210" y="253" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12.5"
          fill="#9198a1">VideoEncoder</text><path d="M190 263 l10 10 M200 263 l-10 10" fill="none"
              stroke="#f85149" stroke-width="2" stroke-linecap="round"/>
    <text x="210" y="274" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12.5"
          fill="#9198a1">AudioDecoder</text><path d="M190 284 l10 10 M200 284 l-10 10" fill="none"
              stroke="#f85149" stroke-width="2" stroke-linecap="round"/>
    <text x="210" y="295" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12.5"
          fill="#9198a1">setTimeout</text><path d="M190 305 l10 10 M200 305 l-10 10" fill="none"
              stroke="#f85149" stroke-width="2" stroke-linecap="round"/>
    <text x="210" y="316" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12.5"
          fill="#9198a1">setInterval</text>
  <text x="190" y="360" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#f85149">
    Patch here and every codec is missed.
  </text>

  
  <rect x="470" y="100" width="260" height="290" rx="8"
        fill="#151b23" stroke="#3fb950" stroke-width="1.5"/>
  <text x="486" y="126" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14"
        font-weight="600" fill="#f0f6fc">Phase 2 — complete, still early</text>
  <text x="486" y="146" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12"
        fill="#9198a1">Debugger.setInstrumentationBreakpoint</text>
  <path d="M490 161 l4 4 l7 -8" fill="none" stroke="#3fb950" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
    <text x="510" y="169" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12.5"
          fill="#f0f6fc">VideoFrame</text><path d="M490 182 l4 4 l7 -8" fill="none" stroke="#3fb950" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
    <text x="510" y="190" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12.5"
          fill="#f0f6fc">AudioData</text><path d="M490 203 l4 4 l7 -8" fill="none" stroke="#3fb950" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
    <text x="510" y="211" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12.5"
          fill="#f0f6fc">EncodedVideoChunk</text><path d="M490 224 l4 4 l7 -8" fill="none" stroke="#3fb950" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
    <text x="510" y="232" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12.5"
          fill="#f0f6fc">VideoDecoder</text><path d="M490 245 l4 4 l7 -8" fill="none" stroke="#3fb950" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
    <text x="510" y="253" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12.5"
          fill="#f0f6fc">VideoEncoder</text><path d="M490 266 l4 4 l7 -8" fill="none" stroke="#3fb950" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
    <text x="510" y="274" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12.5"
          fill="#f0f6fc">AudioDecoder</text><path d="M490 287 l4 4 l7 -8" fill="none" stroke="#3fb950" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
    <text x="510" y="295" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12.5"
          fill="#f0f6fc">setTimeout</text><path d="M490 308 l4 4 l7 -8" fill="none" stroke="#3fb950" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
    <text x="510" y="316" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12.5"
          fill="#f0f6fc">setInterval</text>
  <text x="490" y="360" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#3fb950">
    Inject here. Nothing has run yet.
  </text>

  <!-- resume arrow between the two -->
  <path d="M436 245 L462 245" stroke="#4493f8" stroke-width="2" fill="none"
        marker-end="url(#arrow-f0f6fc)"/>
  <defs>
    <marker id="arrow-f0f6fc" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4493f8"/>
    </marker>
  </defs>
  <text x="449" y="236" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#4493f8"
        text-anchor="middle">resume</text>

  <rect x="760" y="100" width="140" height="290" rx="8" fill="#121d2f"
        stroke="#4493f8" stroke-width="1"/>
  <text x="774" y="126" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600"
        fill="#f0f6fc">Why it matters</text>
  <text x="774" y="152" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#9198a1">Decoders usually</text><text x="774" y="169" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#9198a1">live in workers.</text><text x="774" y="186" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#9198a1"></text><text x="774" y="203" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#9198a1">Page-level</text><text x="774" y="220" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#9198a1">patching cannot</text><text x="774" y="237" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#9198a1">reach them at all.</text><text x="774" y="254" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#9198a1"></text><text x="774" y="271" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#9198a1">Miss them and the</text><text x="774" y="288" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#9198a1">tool reports "no</text><text x="774" y="305" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#9198a1">leaks" for an app</text><text x="774" y="322" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#9198a1">losing every frame.</text>
</svg>
