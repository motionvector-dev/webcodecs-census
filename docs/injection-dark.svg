<svg xmlns="http://www.w3.org/2000/svg" width="880" height="552" viewBox="0 0 880 552" role="img"
     aria-label="Sequence diagram. The driver arms auto-attach; Chrome pauses the new worker before its first line, but the worker global is incomplete there — codecs and timers do not exist yet. The driver sets a beforeScriptExecution breakpoint and resumes, landing in a second pause where the global is complete and the worker's own code still has not run. The census is evaluated there, then execution resumes.">
  <defs>
    <marker id="head-fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f0f6fc"/>
    </marker>
    <marker id="head-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#9198a1"/>
    </marker>
    <marker id="head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#4493f8"/>
    </marker>
    <marker id="head-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#3fb950"/>
    </marker>
  </defs>

  <text x="0" y="16" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#f0f6fc">
    Reaching a worker before its first line takes two pauses, not one
  </text>

  
  <text x="118" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600"
        fill="#f0f6fc" text-anchor="middle">census driver</text>
  <text x="118" y="50" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5"
        fill="#9198a1" text-anchor="middle">your process</text>
  <line x1="118" y1="78" x2="118" y2="526" stroke="#7d8590"
        stroke-width="1.75" stroke-dasharray="5 4"/>
  <text x="440" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600"
        fill="#f0f6fc" text-anchor="middle">Chrome</text>
  <text x="440" y="50" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5"
        fill="#9198a1" text-anchor="middle">DevTools Protocol</text>
  <line x1="440" y1="78" x2="440" y2="526" stroke="#7d8590"
        stroke-width="1.75" stroke-dasharray="5 4"/>
  <text x="762" y="34" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600"
        fill="#f0f6fc" text-anchor="middle">worker</text>
  <text x="762" y="50" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5"
        fill="#9198a1" text-anchor="middle">global scope</text>
  <line x1="762" y1="140" x2="762" y2="526" stroke="#7d8590"
        stroke-width="1.75" stroke-dasharray="5 4"/>

  
  <line x1="124" y1="100" x2="434" y2="100" stroke="#f0f6fc"
        stroke-width="1.5" marker-end="url(#head-fg)"/>
  <text x="279" y="93" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11"
        fill="#f0f6fc" text-anchor="middle">Target.setAutoAttach { waitForDebuggerOnStart }</text>
  
  <path d="M440 121 h26 a5 5 0 0 1 5 5 v8 a5 5 0 0 1 -5 5 h-26" fill="none" stroke="#9198a1" stroke-width="1.3"
        marker-end="url(#head-muted)"/>
  <text x="480" y="135" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5"
        fill="#9198a1" text-anchor="start">page calls new Worker()</text>

  
  <rect x="576" y="158" width="290" height="96" rx="6" fill="#2b1a10" stroke="#7d4e24"
        stroke-width="1"/>
  <text x="596" y="176" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600"
        fill="#e0a53f">Pause 1 — global is half built</text>
  <text x="596" y="192" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5"
             fill="#e0a53f">✓ VideoFrame</text><text x="596" y="207" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5"
             fill="#9198a1">✕ VideoDecoder</text><text x="596" y="222" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5"
             fill="#9198a1">✕ setTimeout</text>
  <text x="596" y="244" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="600"
        fill="#e0a53f">Patch here → every codec missed</text>
  
  <line x1="434" y1="176" x2="124" y2="176" stroke="#f0f6fc"
        stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#head-fg)"/>
  <text x="279" y="169" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11"
        fill="#f0f6fc" text-anchor="middle">attachedToTarget</text>

  
  <line x1="124" y1="274" x2="434" y2="274" stroke="#f0f6fc"
        stroke-width="1.5" marker-end="url(#head-fg)"/>
  <text x="279" y="267" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11"
        fill="#f0f6fc" text-anchor="middle">Debugger.setInstrumentationBreakpoint</text>
  
  <line x1="124" y1="306" x2="434" y2="306" stroke="#4493f8"
        stroke-width="1.5" marker-end="url(#head-accent)"/>
  <text x="279" y="299" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11"
        fill="#4493f8" text-anchor="middle">Runtime.runIfWaitingForDebugger</text>

  
  <rect x="576" y="330" width="290" height="96" rx="6" fill="#0f2417" stroke="#2b6a37"
        stroke-width="1"/>
  <text x="596" y="348" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600"
        fill="#3fb950">Pause 2 — global is complete</text>
  <text x="596" y="364" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5"
             fill="#3fb950">✓ VideoFrame</text><text x="596" y="379" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5"
             fill="#3fb950">✓ VideoDecoder</text><text x="596" y="394" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5"
             fill="#3fb950">✓ setTimeout</text>
  <text x="596" y="416" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="600"
        fill="#3fb950">Inject here → nothing has run yet</text>
  
  <line x1="434" y1="348" x2="124" y2="348" stroke="#f0f6fc"
        stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#head-fg)"/>
  <text x="279" y="341" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11"
        fill="#f0f6fc" text-anchor="middle">Debugger.paused (instrumentation)</text>

  
  <line x1="124" y1="448" x2="434" y2="448" stroke="#3fb950"
        stroke-width="1.5" marker-end="url(#head-ok)"/>
  <text x="279" y="441" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11"
        fill="#3fb950" text-anchor="middle">Runtime.evaluate(census)</text>
  
  <line x1="446" y1="476" x2="756" y2="476" stroke="#3fb950"
        stroke-width="1.5" marker-end="url(#head-ok)"/>
  <text x="601" y="469" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11"
        fill="#3fb950" text-anchor="middle">evaluated in the worker context</text>
  
  <line x1="124" y1="508" x2="434" y2="508" stroke="#4493f8"
        stroke-width="1.5" marker-end="url(#head-accent)"/>
  <text x="279" y="501" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11"
        fill="#4493f8" text-anchor="middle">Debugger.resume</text>
  
  <path d="M762 527 h-26 a5 5 0 0 1 -5 5 v8 a5 5 0 0 1 5 5 h26" fill="none" stroke="#9198a1" stroke-width="1.3"
        marker-end="url(#head-muted)"/>
  <text x="722" y="541" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5"
        fill="#9198a1" text-anchor="end">worker's own first line runs</text>
</svg>
