version: 2
updates:
  # The core package has no runtime dependencies, so this is almost entirely
  # about build and test tooling — and about the GitHub Actions in the release
  # workflow, which is the part with credentials in reach.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
